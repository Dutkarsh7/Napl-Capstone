version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-pharmacy-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: smart_pharmacy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./db/migrations/002_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_pharmacy"]
      interval: 5s
      timeout: 5s
      retries: 5

  ocr-python:
    build:
      context: ./ocr-python
      dockerfile: Dockerfile
    container_name: smart-pharmacy-ocr
    ports:
      - "8000:8000"
    environment:
      - PORT=8000

  validation-fsharp:
    build:
      context: ./validation-fsharp
      dockerfile: Dockerfile
    container_name: smart-pharmacy-validation
    ports:
      - "5005:5005"
    environment:
      - PORT=5005
      - VALIDATION_PORT=5005

  backend-go:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
    container_name: smart-pharmacy-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://postgres:postgrespassword@postgres:5432/smart_pharmacy?sslmode=disable
      - JWT_SECRET=smart-pharmacy-super-secret-capstone-jwt-key-2026
      - OCR_SERVICE_URL=http://ocr-python:8000
      - VALIDATION_SERVICE_URL=http://validation-fsharp:5005
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://localhost:8080
      - UPLOAD_DIR=/app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      ocr-python:
        condition: service_started
      validation-fsharp:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart-pharmacy-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend-go

volumes:
  pgdata:
  uploads_data:
